# 替换域名和证书路径；.env APP_ORIGIN 同步设为 https://prd.example.com，TRUST_PROXY=1。
server {
    listen 80;
    server_name prd.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name prd.example.com;
    ssl_certificate /etc/nginx/certs/prd.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/prd.key.pem;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 覆盖客户端伪造的头；不要把未经信任的 XFF 直接传给应用。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
